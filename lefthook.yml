# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      run: |
        STAGED=$(git diff --cached --name-only)
        EXISTS=$(echo "$STAGED" | grep -v '\.prisma$' | while read f; do [ -e "$f" ] && echo "$f"; done)
        if [ -n "$EXISTS" ]; then
          bun oxlint --fix --no-error-on-unmatched-pattern $EXISTS
        fi
      stage_fixed: true
    - name: oxfmt
      run: |
        STAGED=$(git diff --cached --name-only)
        EXISTS=$(echo "$STAGED" | grep -v '\.prisma$' | while read f; do [ -e "$f" ] && echo "$f"; done)
        if [ -n "$EXISTS" ]; then
          bun oxfmt --write --no-error-on-unmatched-pattern $EXISTS
        fi
      stage_fixed: true
