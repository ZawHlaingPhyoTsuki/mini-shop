# PR checks: lint, format, types, and tests run in parallel; build is gated on all four.
# No secrets required: .env stubs come from the committed .env.example files,
# server tests mock Prisma/env, and `prisma generate` needs no live database.
name: ci

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

# Stubs for required env vars that .env.example ships empty (never connected:
# tests are mocked, generate/build touch no network). Obvious dummies, not secrets.
env:
  AWS_ENDPOINT_URL_S3: https://storage.ci.invalid
  AWS_REGION: ap-southeast-1
  AWS_ACCESS_KEY_ID: ci-stub
  AWS_SECRET_ACCESS_KEY: ci-stub

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp apps/web/.env.example apps/web/.env && cp apps/server/.env.example apps/server/.env
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp apps/web/.env.example apps/web/.env && cp apps/server/.env.example apps/server/.env
      - run: pnpm install --frozen-lockfile
      - run: pnpm format

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp apps/web/.env.example apps/web/.env && cp apps/server/.env.example apps/server/.env
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # PageProps and other route types are generated into .next (gitignored),
      # so a fresh checkout needs typegen before tsc can see them.
      - run: pnpm --filter=web exec next typegen
      - run: pnpm check-types

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp apps/web/.env.example apps/web/.env && cp apps/server/.env.example apps/server/.env
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter=server test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, format, types, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp apps/web/.env.example apps/web/.env && cp apps/server/.env.example apps/server/.env
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
