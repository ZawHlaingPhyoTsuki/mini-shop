name: CI

on:
  pull_request:
  push:
    branches: [dev, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_shop
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/mini_shop
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
      AWS_ENDPOINT_URL_S3: https://example.com
      AWS_REGION: us-east-1
      NEON_BUCKET_NAME: assets
      NEON_BRANCH: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - run: bun run check-types
      - run: bun run test
