# Builds the server image and pushes it to Docker Hub for Azure App Service.
# Only DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets required: the image build
# uses .env.example stubs (nothing secret bakes into the image; runtime values
# come from App Service app settings).
name: docker-server

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - .github/workflows/docker-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-server-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: zawhlaingphyo/tcl-guide-server

jobs:
  push:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp apps/web/.env.example apps/web/.env && cp apps/server/.env.example apps/server/.env
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          secret-files: |
            web_env=apps/web/.env
            server_env=apps/server/.env
          cache-from: type=gha
          cache-to: type=gha,mode=max
